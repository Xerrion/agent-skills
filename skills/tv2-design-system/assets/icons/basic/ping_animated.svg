<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="#000523">
  <g transform="translate(12, 12)">
    <!-- Ring that expands and fades -->
    <circle cx="0" cy="0" r="4.05">
      <animateTransform
        attributeName="transform"
        type="scale"
        dur="2s"
        fill="freeze"
        repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0; 0.07; 0.1; 0.35; 0.5; 1"
        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
        values="0; 0.6; 1; 2.5; 2.5; 2.5" />
      <animate
        attributeName="opacity"
        dur="2s"
        fill="freeze"
        repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0; 0.07; 0.1; 0.35; 0.5; 1"
        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
        values="0.5; 0.5; 0.5; 0.05; 0; 0" />
    </circle>
    <!-- Center dot that pulses -->
    <circle cx="0" cy="0" r="4.05">
      <animateTransform
        attributeName="transform"
        type="scale"
        dur="2s"
        fill="freeze"
        repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0; 0.07; 0.1; 1"
        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
        values="1; 0.6; 1; 1" />
    </circle>
  </g>
</svg>
